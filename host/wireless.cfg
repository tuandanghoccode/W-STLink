# Set PROBE_IP and TARGET_SCRIPT with -c before loading this file.
if {![info exists PROBE_IP]} { error "Set PROBE_IP to the ESP32 IPv4 address" }
if {![info exists TARGET_SCRIPT]} { error "Set TARGET_SCRIPT to the STM32 target .cfg path" }

adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host $PROBE_IP
if {![info exists PROBE_PORT]} { set PROBE_PORT 4441 }
cmsis-dap tcp port $PROBE_PORT
# Keep only one CMSIS-DAP request in flight over the wireless adapter.
cmsis-dap quirk enable
transport select swd

source [find $TARGET_SCRIPT]
adapter speed 100
reset_config none
if {$TARGET_SCRIPT eq "target/stm32f4x.cfg"} {
    stm32f4x.cpu configure -event reset-start { adapter speed 100 }
    stm32f4x.cpu configure -event reset-init { adapter speed 100 }
}

bindto 127.0.0.1
gdb port 3333
tcl port 6666
telnet port disabled
